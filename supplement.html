<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>補送名單 - 魔法音樂學院</title>
    
    <!-- Vue.js 3 -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Comic+Neue:wght@300;400;700&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            font-family: 'Noto Sans TC', 'Comic Neue', sans-serif;
            background: linear-gradient(135deg, #fef3c7 0%, #fed7aa 50%, #fecaca 100%);
            min-height: 100vh;
        }
        
        .family-sky { background: linear-gradient(135deg, #dbeafe 0%, #93c5fd 100%); }
        .family-ocean { background: linear-gradient(135deg, #dcfce7 0%, #86efac 100%); }
        .family-tree { background: linear-gradient(135deg, #fecaca 0%, #f87171 100%); }
        .family-earth { background: linear-gradient(135deg, #fef3c7 0%, #fbbf24 100%); }
        
        .student-button {
            transition: all 0.3s ease;
            transform: translateY(0);
        }
        
        .student-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }
        
        .student-button:active {
            transform: translateY(0);
        }
        
        .student-button.disabled {
            opacity: 0.4;
            transform: translateY(0) !important;
            box-shadow: none !important;
            cursor: not-allowed;
            background: linear-gradient(135deg, #9ca3af 0%, #6b7280 100%) !important;
        }
        
        .student-button.disabled:hover {
            transform: translateY(0) !important;
            box-shadow: none !important;
        }
        
        .magic-sparkle {
            animation: sparkle 2s infinite;
        }
        
        @keyframes sparkle {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.1); }
        }
    </style>
</head>

<body>
    <div id="app" class="min-h-screen p-6">
        <!-- 標題區 -->
        <div class="text-center mb-8">
            <div class="inline-block bg-white/90 backdrop-blur-sm rounded-3xl px-8 py-6 shadow-xl">
                <h1 class="text-4xl font-bold text-orange-800 mb-2">
                    <i class="fas fa-scroll mr-3 text-yellow-600"></i>
                    補送名單
                </h1>
                <p class="text-orange-600 text-lg">魔法音樂學院學生清單</p>
                <div class="flex justify-center items-center mt-4 space-x-4">
                    <span class="text-sm text-orange-700">
                        <i class="fas fa-users mr-1"></i>
                        總共 {{ studentList.length }} 位學生
                    </span>
                    <div class="magic-sparkle">
                        <i class="fas fa-star text-yellow-500"></i>
                    </div>
                </div>
            </div>
        </div>

        <!-- 家族圖例 -->
        <div class="max-w-4xl mx-auto mb-6">
            <div class="bg-white/90 backdrop-blur-sm rounded-2xl p-6 shadow-lg">
                <h3 class="text-lg font-semibold text-orange-800 mb-4 text-center">
                    <i class="fas fa-flag mr-2"></i>家族圖例
                </h3>
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                    <div class="family-sky rounded-xl p-3 text-center">
                        <i class="fas fa-cloud text-blue-700 text-xl mb-1"></i>
                        <div class="font-semibold text-blue-800">天空</div>
                        <div class="text-sm text-blue-700">家族 01</div>
                    </div>
                    <div class="family-ocean rounded-xl p-3 text-center">
                        <i class="fas fa-wave-square text-green-700 text-xl mb-1"></i>
                        <div class="font-semibold text-green-800">海洋</div>
                        <div class="text-sm text-green-700">家族 02</div>
                    </div>
                    <div class="family-tree rounded-xl p-3 text-center">
                        <i class="fas fa-tree text-red-700 text-xl mb-1"></i>
                        <div class="font-semibold text-red-800">樹居</div>
                        <div class="text-sm text-red-700">家族 03</div>
                    </div>
                    <div class="family-earth rounded-xl p-3 text-center">
                        <i class="fas fa-mountain text-yellow-700 text-xl mb-1"></i>
                        <div class="font-semibold text-yellow-800">大地</div>
                        <div class="text-sm text-yellow-700">家族 04</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 互動燈光模式控制 -->
        <div class="max-w-4xl mx-auto mb-6">
            <div class="bg-white/90 backdrop-blur-sm rounded-2xl p-6 shadow-lg">
                <h3 class="text-lg font-semibold text-orange-800 mb-2 text-center">
                    <i class="fas fa-lightbulb mr-2"></i>互動燈光模式
                </h3>
                <p class="text-center text-sm text-gray-600 mb-4">{{ interactiveStatusText }}</p>
                <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
                    <button
                        @click="startInteractiveMode"
                        class="rounded-xl py-3 px-2 font-semibold text-white shadow transition bg-purple-500 hover:bg-purple-600"
                    >
                        <i class="fas fa-gamepad mr-1"></i>進入互動模式
                    </button>
                    <button
                        @click="startMode1"
                        :disabled="interactiveState !== 'waiting_mode1'"
                        class="rounded-xl py-3 px-2 font-semibold text-white shadow transition"
                        :class="interactiveState === 'waiting_mode1' ? 'bg-blue-500 hover:bg-blue-600' : 'bg-gray-300 cursor-not-allowed'"
                    >
                        <i class="fas fa-play mr-1"></i>模式一
                    </button>
                    <button
                        @click="startMode2"
                        :disabled="interactiveState !== 'waiting_mode2'"
                        class="rounded-xl py-3 px-2 font-semibold text-white shadow transition"
                        :class="interactiveState === 'waiting_mode2' ? 'bg-pink-500 hover:bg-pink-600' : 'bg-gray-300 cursor-not-allowed'"
                    >
                        <i class="fas fa-random mr-1"></i>模式二
                    </button>
                    <button
                        @click="exitInteractiveMode"
                        :disabled="interactiveState === 'idle'"
                        class="rounded-xl py-3 px-2 font-semibold text-white shadow transition"
                        :class="interactiveState !== 'idle' ? 'bg-red-500 hover:bg-red-600' : 'bg-gray-300 cursor-not-allowed'"
                    >
                        <i class="fas fa-door-open mr-1"></i>離開互動模式
                    </button>
                </div>
            </div>
        </div>

        <!-- 學生按鍵網格 -->
        <div class="max-w-7xl mx-auto">
            <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-4">
                <button 
                    v-for="student in studentList" 
                    :key="student.audioFile"
                    @click="!isStudentPlayed(student.audioFile) && sendMqttMessage(student)"
                    :disabled="isStudentPlayed(student.audioFile)"
                    :class="[
                        'student-button',
                        'rounded-2xl p-4 shadow-lg border-2 border-white/30',
                        isStudentPlayed(student.audioFile) ? 'disabled' : getFamilyColorClass(student.familyCode)
                    ]"
                >
                    <div class="text-center">
                        <div class="font-bold text-lg mb-1" :class="isStudentPlayed(student.audioFile) ? 'text-gray-400' : getFamilyTextClass(student.familyCode)">
                            {{ student.audioFile }}
                        </div>
                        <div class="font-medium text-base" :class="isStudentPlayed(student.audioFile) ? 'text-gray-400' : getFamilyTextClass(student.familyCode)">
                            {{ student.name }}
                        </div>
                        <div class="text-xs mt-2 opacity-75" :class="isStudentPlayed(student.audioFile) ? 'text-gray-500' : getFamilyTextClass(student.familyCode)">
                            {{ student.family }}
                        </div>
                        <div v-if="isStudentPlayed(student.audioFile)" class="text-xs mt-1 text-gray-500">
                            <i class="fas fa-check-circle mr-1"></i>已播放
                        </div>
                    </div>
                </button>
            </div>
        </div>

        <!-- 狀態顯示 -->
        <div class="fixed bottom-4 right-4 bg-white/90 backdrop-blur-sm rounded-2xl p-4 shadow-xl max-w-sm">
            <div class="text-sm text-gray-700">
                <div class="flex items-center mb-2">
                    <i class="fas fa-wifi text-green-500 mr-2"></i>
                    <span class="font-semibold">MQTT 狀態</span>
                </div>
                <div v-if="lastSentMessage" class="text-xs">
                    最後發送: {{ lastSentMessage }}
                </div>
            </div>
        </div>
    </div>

    <script>

                        {name: '郭芝羽', audioFile: '074', family: '海洋', familyCode: '02'},

                        {name: '馬一特', audioFile: '076', family: '樹居', familyCode: '03'},

                        {name: '林立秧', audioFile: '078', family: '天空', familyCode: '01'},
                        {name: '黃歆夏', audioFile: '079', family: '樹居', familyCode: '03'},
                        {name: '李恩予', audioFile: '080', family: '海洋', familyCode: '02'},
                        {name: '黃若晞', audioFile: '081', family: '大地', familyCode: '04'},
                        {name: '果林', audioFile: '082', family: '大地', familyCode: '04'},
                        {name: '劉凌菲', audioFile: '083', family: '海洋', familyCode: '02'},
                        {name: '潘孫禮', audioFile: '084', family: '樹居', familyCode: '03'}
                    ]
                }
            },
            computed: {
                interactiveStatusText() {
                    switch (this.interactiveState) {
                        case 'idle': return '🕹️ 待機中(掃卡模式)';
                        case 'waiting_mode1': return '⏳ 已進入互動模式,燈已關閉,等待按下「模式一」';
                        case 'mode1_running': return `✨ 模式一進行中...(${this.mode1Remaining} 秒)`;
                        case 'waiting_mode2': return '⏳ 模式一結束,等待按下「模式二」';
                        case 'mode2_running': return '🌈 模式二進行中,結束後會自動回到待機刷卡模式';
                        default: return '';
                    }
                }
            },
            async mounted() {
                // 頁面載入時獲取已播放檔案列表
                await this.loadPlayedFiles();
                
                // 設定定時器定期檢查已播放狀態
                setInterval(async () => {
                    await this.loadPlayedFiles();
                }, 3000); // 每3秒檢查一次
            },
            methods: {
                getFamilyColorClass(familyCode) {
                    switch(familyCode) {
                        case '01': return 'family-sky';
                        case '02': return 'family-ocean';
                        case '03': return 'family-tree';
                        case '04': return 'family-earth';
                        default: return 'bg-gray-200';
                    }
                },
                
                getFamilyTextClass(familyCode) {
                    switch(familyCode) {
                        case '01': return 'text-blue-800';
                        case '02': return 'text-green-800';
                        case '03': return 'text-red-800';
                        case '04': return 'text-yellow-800';
                        default: return 'text-gray-800';
                    }
                },
                
                async loadPlayedFiles() {
                    try {
                        const response = await fetch('/api/played-files');
                        if (response.ok) {
                            const data = await response.json();
                            this.playedFiles = data.playedFiles || [];
                            this.playOnceMode = data.playOnceMode || false;
                        }
                    } catch (error) {
                        console.error('載入已播放檔案列表時發生錯誤:', error);
                    }
                },
                
                isStudentPlayed(audioFile) {
                    return this.playedFiles.includes(audioFile);
                },
                
                async sendMqttMessage(student) {
                    // 雙重檢查是否已播放
                    if (this.isStudentPlayed(student.audioFile)) {
                        console.log(`跳過已播放的檔案: ${student.audioFile}`);
                        return;
                    }
                    
                    const message = `${student.audioFile},${student.familyCode}`;
                    this.lastSentMessage = `${student.name}: ${message}`;
                    
                    try {
                        // 發送 MQTT 訊息到後端
                        const response = await fetch('/api/send-mqtt', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                            },
                            body: JSON.stringify({
                                topic: 'puffin-test',
                                message: message
                            })
                        });
                        
                        if (response.ok) {
                            console.log(`成功發送 MQTT 訊息: ${message}`);
                            // 立即將按鍵標記為已播放以防止重複點擊
                            if (!this.playedFiles.includes(student.audioFile)) {
                                this.playedFiles.push(student.audioFile);
                            }
                            // 延後重新載入已播放檔案列表以確保與伺服器同步
                            setTimeout(() => {
                                this.loadPlayedFiles();
                            }, 2000);
                        } else {
                            console.error('發送 MQTT 訊息失敗');
                        }
                    } catch (error) {
                        console.error('發送 MQTT 訊息時發生錯誤:', error);
                    }
                },

                sendControlCommand(message) {
                    return fetch('/api/send-mqtt', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            topic: 'puffin-control',
                            message: message
                        })
                    });
                },

                async startInteractiveMode() {
                    // 不檢查目前狀態：MQTT 沒有送達保證，主持人隨時可以補按重送
                    // Arduino 端 INTERACTIVE_START 本來就不檢查狀態，任何時候收到都會重置成等待模式一
                    if (this.mode1Interval) {
                        clearInterval(this.mode1Interval);
                        this.mode1Interval = null;
                    }
                    if (this.mode2Timeout) {
                        clearTimeout(this.mode2Timeout);
                        this.mode2Timeout = null;
                    }
                    try {
                        await this.sendControlCommand('INTERACTIVE_START');
                        this.interactiveState = 'waiting_mode1';
                    } catch (error) {
                        console.error('進入互動模式失敗:', error);
                    }
                },

                async startMode1() {
                    if (this.interactiveState !== 'waiting_mode1') return;
                    try {
                        await this.sendControlCommand('MODE1_START');
                        this.interactiveState = 'mode1_running';
                        this.mode1Remaining = 8;
                        this.mode1Interval = setInterval(() => {
                            this.mode1Remaining--;
                            if (this.mode1Remaining <= 0) {
                                clearInterval(this.mode1Interval);
                                this.mode1Interval = null;
                                this.interactiveState = 'waiting_mode2';
                            }
                        }, 1000);
                    } catch (error) {
                        console.error('啟動模式一失敗:', error);
                    }
                },

                async startMode2() {
                    if (this.interactiveState !== 'waiting_mode2') return;
                    try {
                        await this.sendControlCommand('MODE2_START');
                        this.interactiveState = 'mode2_running';
                        this.mode2Timeout = setTimeout(() => {
                            // 模式二實際跑 7 秒(見 Arduino 燈效規格文件),這裡跟著同步
                            this.interactiveState = 'idle';
                            this.mode2Timeout = null;
                        }, 7000);
                    } catch (error) {
                        console.error('啟動模式二失敗:', error);
                    }
                },

                async exitInteractiveMode() {
                    if (this.interactiveState === 'idle') return;
                    if (this.mode1Interval) {
                        clearInterval(this.mode1Interval);
                        this.mode1Interval = null;
                    }
                    if (this.mode2Timeout) {
                        clearTimeout(this.mode2Timeout);
                        this.mode2Timeout = null;
                    }
                    this.interactiveState = 'idle';
                    try {
                        await this.sendControlCommand('INTERACTIVE_EXIT');
                    } catch (error) {
                        console.error('離開互動模式失敗:', error);
                    }
                }
            }
        }).mount('#app');
    </script>
</body>
</html>
