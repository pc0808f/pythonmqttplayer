            animation: sparkle 2s infinite;

                        'student-button',
                        'rounded-2xl p-4 shadow-lg border-2 border-white/30',
                        getFamilyColorClass(student.familyCode)

                >
                    <div class="text-center">
                        <div class="font-bold text-lg mb-1" :class="getFamilyTextClass(student.familyCode)">
                            {{ student.audioFile }}
                        </div>
                        <div class="font-medium text-base" :class="getFamilyTextClass(student.familyCode)">
                            {{ student.name }}
                        </div>
                        <div class="text-xs mt-2 opacity-75" :class="getFamilyTextClass(student.familyCode)">
                            {{ student.family }}
                        </div>
                    </div>
                </button>
            </div>
        </div>

            methods: {
                getFamilyColorClass(familyCode) {
                    switch(familyCode) {
                        case '01': return 'family-sky';
                        case '02': return 'family-ocean';
                        case '03': return 'family-tree';
                        case '04': return 'family-earth';
                        default: return 'bg-gray-200';
                    }
                },
                
                getFamilyTextClass(familyCode) {
                    switch(familyCode) {
                        case '01': return 'text-blue-800';
                        case '02': return 'text-cyan-800';
                        case '03': return 'text-green-800';
                        case '04': return 'text-orange-800';
                        default: return 'text-gray-800';
                    }
                },
                
                async sendMqttMessage(student) {
                    const message = `${student.audioFile},${student.familyCode}`;
                    this.lastSentMessage = `${student.name}: ${message}`;
                    
                    try {
                        // 發送 MQTT 訊息到後端
                        const response = await fetch('/api/send-mqtt', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                            },
                            body: JSON.stringify({
                                topic: 'puffin-test',
                                message: message
                            })
                        });
                        
                        if (response.ok) {
                            console.log(`成功發送 MQTT 訊息: ${message}`);
                        } else {
                            console.error('發送 MQTT 訊息失敗');
                        }
                    } catch (error) {
                        console.error('發送 MQTT 訊息時發生錯誤:', error);
                    }
                }
